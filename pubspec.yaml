name: adyen_api
description: A comprehensive Dart library for integrating Adyen payment APIs, providing type-safe access to payment processing services for Flutter and Dart applications.
version: 0.4.0
repository: https://github.com/Lutra-Fs/adyen_api_dart
issue_tracker: https://github.com/Lutra-Fs/adyen_api_dart/issues

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  # web: Partially supported - Terminal Local API requires dart:io

environment:
  sdk: ^3.10.3

dependencies:
  built_collection: ^5.1.1
  built_value: ^8.12.7
  crypto: ^3.0.7
  dio: ^5.11.1
  one_of: ^1.5.0
  one_of_serializer: ^1.5.0
  pointycastle: ^4.0.0

dev_dependencies:
  build_runner: ^2.15.1
  built_value_generator: ^8.12.5
  http_mock_adapter: ^0.6.1
  lints: ^6.1.0
  test: ^1.31.1
  convert: ^3.1.2
